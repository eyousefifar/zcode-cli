name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build all cross targets
        run: bash scripts/build.sh all

      - name: Smoke test (native build runs)
        if: runner.os == 'Linux'
        run: ./dist/zcode-linux-x64 --version

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zcode-darwin-arm64
            dist/zcode-darwin-x64
            dist/zcode-linux-x64
            dist/zcode-linux-arm64
          generate_release_notes: true
