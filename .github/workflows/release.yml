# Release pipeline (ASD-ST100 R1.5 / D2).
#
# Contract: a release artifact is only published if
#   1. the full offline quality gate passed (job `gate`),
#   2. every target binary was actually executed and printed the version
#      matching the pushed tag — darwin-arm64 and darwin-x64 on native macOS
#      runners (Intel macos-13: bun's x64 build needs AVX, absent under
#      Rosetta), linux-x64 natively, linux-arm64 under qemu,
#   3. SHA256SUMS over all four binaries is generated and published with them.
#
# Bun and every action are pinned to exact commit SHAs (floating tags are a
# supply-chain hole; see ASD-ST100 §3/M2). Bump pins deliberately.
#
# A tag push (v*) builds and publishes; workflow_dispatch runs the same
# pipeline end-to-end but skips the publish step (dry run).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read  # jobs escalate individually (publish needs write)

jobs:
  gate:
    name: Offline quality gate
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Offline gate (build + tier 1-3 tests + npm smoke)
        run: |
          set -o pipefail
          bash scripts/gate.sh 2>&1 | tee gate.log

      - name: Upload gate logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-logs-${{ github.run_id }}
          path: |
            gate.log
            /tmp/zcode-test/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build & execute ${{ matrix.target }}
    needs: gate
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            smoke: native
          # Real Intel runner: bun's x64 build requires AVX, which Rosetta
          # (arm64 runners) does not emulate — the dry run proved it (SIGILL
          # under Rosetta). macos-13 is retired (Dec 2025); macos-15-intel is
          # the supported Intel image.
          - target: darwin-x64
            os: macos-15-intel
            smoke: native
          - target: linux-x64
            os: ubuntu-24.04
            smoke: native
          - target: linux-arm64
            os: ubuntu-24.04
            smoke: qemu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Build cross target
        run: bash scripts/build.sh bun-${{ matrix.target }}

      - name: Assert binary version matches the tag
        run: |
          set -euo pipefail
          # Only tag pushes carry a version contract; workflow_dispatch is a
          # dry run (publish is also tag-gated).
          case "${GITHUB_REF_NAME:-}" in
            v*) want="${GITHUB_REF_NAME#v}" ;;
            *) want="" ;;
          esac
          # Non-native targets still execute the real binary (linux-arm64
          # under qemu); version printing is part of the smoke.
          case "${{ matrix.smoke }}" in
            native) : ;;
            qemu) sudo apt-get -y update >/dev/null && sudo apt-get -y install qemu-user-static >/dev/null ;;
          esac
          binary="dist/zcode-${{ matrix.target }}"
          chmod +x "$binary"
          case "${{ matrix.smoke }}" in
            native) got=$("$binary" --version) ;;
            qemu) got=$(docker run --rm --platform linux/arm64 -v "$(pwd)/dist:/dist:ro" \
                    ubuntu:22.04 /dist/zcode-${{ matrix.target }} --version) ;;
          esac
          echo "binary version: '$got' — expected: '$want'"
          if [[ -n "$want" && "$got" != "$want" ]]; then
            echo "::error::tag/version mismatch: binary '$got' != tag '$want'"
            exit 1
          fi

      - name: Digest the executed binary
        # The digest travels WITH the artifact so the publish job can prove
        # the file it publishes is byte-identical to the binary that was
        # executed in the smoke step (artifact-swap defense).
        run: |
          cd dist
          shasum -a 256 zcode-${{ matrix.target }} > "zcode-${{ matrix.target }}.sha256"

      - name: Upload target artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zcode-${{ matrix.target }}
          path: |
            dist/zcode-${{ matrix.target }}
            dist/zcode-${{ matrix.target }}.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Verify digests & publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # release upload only; every other job stays read-only
    # Verification runs on EVERY pipeline execution (workflow_dispatch is a
    # true end-to-end dry run); the release upload below additionally
    # requires a real tag PUSH — a dispatch targeting a tag ref must not be
    # able to publish (judge round 2, codex #10).
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: zcode-*
          merge-multiple: true

      - name: Verify build digests, then generate SHA256SUMS
        run: |
          cd dist
          chmod +x zcode-*
          # Each binary must match the digest its build job recorded AFTER the
          # smoke execution — a substituted artifact fails here.
          shasum -a 256 -c zcode-darwin-arm64.sha256 zcode-darwin-x64.sha256 zcode-linux-x64.sha256 zcode-linux-arm64.sha256
          sha256sum zcode-darwin-arm64 zcode-darwin-x64 zcode-linux-x64 zcode-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/zcode-darwin-arm64
            dist/zcode-darwin-x64
            dist/zcode-linux-x64
            dist/zcode-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
